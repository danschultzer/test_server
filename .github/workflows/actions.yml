name: Actions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-slim
    name: Lockfile
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  zizmor:
    runs-on: ubuntu-slim
    name: zizmor
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - run: pipx run --spec zizmor==1.32.0 zizmor .github/workflows
